<h2>Request a Brochure</h2>
<p>
  Please fill in your address and below and we will send you a brochure with
  more information.
</p>
<form class="flex flex-col w-fit items-center" [formRoot]="addressForm">
  <app-text-field
    [fieldTree]="addressForm.address"
    label="Address"
    placeholder="Please enter your address"
  />
  <div class="my-4 flex gap-x-4">
    <a mat-raised-button routerLink="../../" type="Button">Cancel</a>
    <button
      color="primary"
      data-testid="btn-search"
      mat-raised-button
      type="submit"
      [disabled]="addressForm().invalid()"
    >
      Send
    </button>
  </div>
</form>

@if (brochureSent()) {
  <p data-testid="lookup-result" aria-live="assertive" role="status">
    Brochure sent
  </p>
}
